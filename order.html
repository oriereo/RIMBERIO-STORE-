<!-- FORM ORDER -->
<center><h2>Fill This Form to Order</h2></center>

<form action="#" method="post" style="max-width:400px; margin:auto;">
  <p>
    <input type="text" id="name" name="name" placeholder="Name" 
      style="width:100%; padding:10px; margin:6px 0;" required>
  </p>

  <p>
    <select id="product" name="product" 
      style="width:100%; padding:10px; margin:6px 0;" required>
      <option value="">-- Select Product --</option>
      <option value="shirts">Shirts</option>
      <option value="outer">Outer</option>
      <option value="dress">Dress</option>
      <option value="pants">Pants</option>
    </select>
  </p>

  <p>
    <input type="text" id="code" name="code" 
      placeholder="Product Code (e.g. SH123)" 
      style="width:100%; padding:10px; margin:6px 0;">
  </p>

  <p>
    <input type="number" id="quantity" name="quantity" min="1" max="20" value="1" 
      placeholder="Quantity" style="width:100%; padding:10px; margin:6px 0;">
  </p>

  <p>
    <textarea id="address" name="address" rows="3" 
      placeholder="Shipping Address" 
      style="width:100%; padding:10px; margin:6px 0;" required></textarea>
  </p>

  <p>
    <input type="tel" id="phone" name="phone" 
      placeholder="Phone Number (e.g. 081234567890)" 
      style="width:100%; padding:10px; margin:6px 0;" required>
  </p>

  <!-- Submit -->
  <p style="text-align:center;">
    <button type="submit" 
      style="padding:10px 25px; background:#5A4BFF; color:white; border:none; border-radius:20px; cursor:pointer;">
      🛒 Order Now
    </button>
  </p>
</form>
